# Gestion stack — runs entirely in Docker (dev and prod base).
# Services: postgres, redis, web (Django+DRF), celery worker, celery beat, frontend (Vite).
# Dev: code is bind-mounted for autoreload; published ports bound to 127.0.0.1 (private only).
name: gestion

x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:-postgres://gestion:gestion@postgres:5432/gestion}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-change-me}
  DEBUG: ${DEBUG:-true}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
  USE_SAP_MOCK: ${USE_SAP_MOCK:-true}
  PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://host.docker.internal:3000}
  SYNC_SERVICE_TOKEN: ${SYNC_SERVICE_TOKEN:-}
  SYNC_HMAC_SECRET: ${SYNC_HMAC_SECRET:-}
  SYNC_POLL_SECONDS: ${SYNC_POLL_SECONDS:-120}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gestion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gestion}
      POSTGRES_DB: ${POSTGRES_DB:-gestion}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gestion}"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    environment: *backend-env
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  celery:
    build: ./backend
    command: celery -A config worker -l info
    environment: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy

  beat:
    build: ./backend
    command: celery -A config beat -l info
    environment: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy

  # React (Vite) dev server. Repo root is mounted so the shared @ama/tokens
  # workspace package resolves; node_modules lives in a named volume.
  frontend:
    image: node:20-alpine
    working_dir: /workspace/gestion/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    volumes:
      - ../:/workspace
      - frontend_node_modules:/workspace/gestion/frontend/node_modules
    ports:
      - "127.0.0.1:5174:5174"

volumes:
  pgdata:
  frontend_node_modules:
